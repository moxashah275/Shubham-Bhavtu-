<app-page-hero
  align="center"
  eyebrow="Contact us"
  title="Contact Gathbandhan"
  [showLine]="false"
/>

<section class="relative overflow-hidden bg-blush/50 py-12 sm:py-20">
  <div class="pointer-events-none absolute -top-24 right-0 h-72 w-72 rounded-full bg-gold/10 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-16 left-10 h-56 w-56 rounded-full bg-burgundy/5 blur-3xl"></div>

  <div class="relative mx-auto max-w-7xl px-5 lg:px-8">
    <div class="grid items-stretch gap-8 lg:grid-cols-[1.08fr_0.92fr] lg:gap-12">
      <div class="relative min-h-[32rem] overflow-hidden rounded-2xl lg:min-h-full">
        <img
          [src]="careImage"
          alt="Gathbandhan care team"
          class="absolute inset-0 h-full w-full object-cover object-top"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-charcoal/70 via-charcoal/20 to-transparent"></div>
        <div class="absolute inset-x-4 bottom-4 rounded-2xl border border-gold/25 bg-ivory/95 p-4 shadow-[0_16px_40px_rgba(43,36,32,0.18)] sm:inset-x-6 sm:bottom-6 sm:p-5">
          <div class="grid grid-cols-2 gap-x-4 gap-y-4">
            @for (fact of facts; track fact.label) {
              <div class="min-w-0">
                <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-blush text-burgundy">
                  <svg [lucideIcon]="fact.icon" [size]="15" aria-hidden="true"></svg>
                </span>
                <p class="mt-2 text-[11px] font-semibold tracking-[0.16em] text-gold-deep uppercase">{{ fact.label }}</p>
                <p class="mt-1 text-sm leading-5 text-charcoal">{{ fact.value }}</p>
              </div>
            }
          </div>
        </div>
      </div>

      <form
        class="flex min-w-0 flex-col rounded-2xl border border-gold/20 bg-white p-6 shadow-[0_22px_50px_rgba(43,36,32,0.08)] sm:p-8"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
      >
        <p class="text-xs font-semibold tracking-[0.18em] text-gold uppercase">Write to us</p>
        <div class="w-fit">
          <h2 class="mt-3 font-serif text-2xl leading-snug text-charcoal sm:text-3xl">Send a message</h2>
          <span class="mt-1.5 block h-px w-1/2 bg-gold"></span>
        </div>
        <p class="mt-5 text-sm leading-7 text-stone-500">
          Share your name and how we can help. A person on our care desk will reply.
        </p>

        <label class="mt-8 block text-sm font-medium text-charcoal">
          Name
          <input
            formControlName="name"
            class="mt-2 h-12 w-full rounded-lg border border-stone-300 bg-ivory px-3 text-sm outline-none focus:border-burgundy"
            placeholder="Your name"
          />
          @if (form.controls.name.touched && form.controls.name.invalid) {
            <p class="mt-1.5 text-xs text-burgundy">Please enter your name.</p>
          }
        </label>
        <label class="mt-4 block text-sm font-medium text-charcoal">
          Email
          <input
            formControlName="email"
            type="email"
            class="mt-2 h-12 w-full rounded-lg border border-stone-300 bg-ivory px-3 text-sm outline-none focus:border-burgundy"
            placeholder="Your email"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <p class="mt-1.5 text-xs text-burgundy">Please enter a valid email.</p>
          }
        </label>
        <label class="mt-4 block text-sm font-medium text-charcoal">
          Message
          <textarea
            formControlName="message"
            rows="5"
            class="mt-2 w-full rounded-lg border border-stone-300 bg-ivory px-3 py-3 text-sm outline-none focus:border-burgundy"
            placeholder="How can we help?"
          ></textarea>
          @if (form.controls.message.touched && form.controls.message.invalid) {
            <p class="mt-1.5 text-xs text-burgundy">Please enter a message.</p>
          }
        </label>
          <button
            type="submit"
            class="mt-6 inline-flex h-12 w-full cursor-pointer items-center justify-center rounded-lg bg-burgundy px-5 text-sm font-semibold text-white transition hover:bg-burgundy-deep sm:w-auto"
          >
          Send Message
        </button>
      </form>
    </div>
  </div>
</section>
