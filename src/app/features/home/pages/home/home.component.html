<app-hero-banner />
<app-partner-search />
<app-site-highlights />

<section class="mx-auto max-w-7xl px-5 py-12 sm:py-16 lg:px-8">
  <div class="max-w-2xl">
    <p class="text-xs font-semibold tracking-[0.18em] text-gold uppercase">How it works</p>
    <div class="w-fit">
      <h2 class="mt-3 font-serif text-2xl leading-tight text-charcoal sm:text-3xl">Three gentle steps to a match</h2>
      <span class="mt-1.5 block h-px w-1/2 bg-gold"></span>
    </div>
  </div>
  <div class="mt-10 grid gap-6 md:grid-cols-3">
    @for (step of steps; track step.title) {
      <article class="rounded-2xl border border-gold/15 bg-white p-6 shadow-sm sm:p-7">
        <p class="font-serif text-3xl text-gold">{{ step.number }}</p>
        <h3 class="mt-4 font-serif text-2xl text-charcoal">{{ step.title }}</h3>
        <p class="mt-2 text-sm leading-6 text-stone-500">{{ step.copy }}</p>
      </article>
    }
  </div>
</section>

<section class="bg-white py-12 sm:py-16">
  <div class="mx-auto max-w-7xl px-5 lg:px-8">
    <div class="flex items-end justify-between gap-4">
      <div class="min-w-0">
        <p class="text-xs font-semibold tracking-[0.18em] text-gold uppercase">Featured profiles</p>
        <div class="w-fit">
          <h2 class="mt-2 font-serif text-2xl text-charcoal sm:text-3xl">Begin with someone who feels familiar</h2>
          <span class="mt-1.5 block h-px w-1/2 bg-gold"></span>
        </div>
      </div>
    </div>
    <div class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (profile of matches; track profile.id) {
        <app-match-card [profile]="profile" />
      }
    </div>
  </div>
</section>
