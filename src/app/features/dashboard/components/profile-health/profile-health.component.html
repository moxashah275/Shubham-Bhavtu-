<section class="relative z-20 mx-auto -mt-12 max-w-6xl px-5 lg:px-8">
  <article class="flex items-center gap-4 rounded-2xl border border-gold/10 bg-white px-5 py-2.5 shadow-[0_14px_36px_rgba(43,36,32,0.10)] sm:gap-6 sm:px-6 sm:py-3">
    <div class="min-w-0 flex-1">
      <div class="flex items-baseline justify-between gap-3">
        <h2 class="font-serif text-lg text-charcoal sm:text-xl">Profile completeness</h2>
        <p class="shrink-0 text-sm font-semibold text-charcoal sm:text-base">{{ completion().percent }}% Complete</p>
      </div>

      <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-blush">
        <div
          class="profile-health-fill h-full rounded-full bg-burgundy"
          [style.width.%]="barWidth()"
        ></div>
      </div>

      <p class="mt-1.5 text-sm leading-5 text-stone-500">{{ completion().hint }}</p>
    </div>

    @if (complete()) {
      <a
        routerLink="/profile"
        class="inline-flex h-12 shrink-0 items-center gap-2 rounded-lg bg-gold px-5 text-sm font-semibold text-charcoal"
      >
        View Profile
        <svg lucideArrowRight [size]="18" aria-hidden="true"></svg>
      </a>
    } @else {
      <a
        routerLink="/profile"
        class="inline-flex h-12 shrink-0 items-center gap-2 rounded-lg bg-gold px-5 text-sm font-semibold text-charcoal"
      >
        Complete Profile
        <svg lucideArrowRight [size]="18" aria-hidden="true"></svg>
      </a>
    }
  </article>
</section>
