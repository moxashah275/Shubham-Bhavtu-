<label class="block">
  <span
    class="block text-sm font-medium leading-5 text-charcoal/80"
    [class.mb-1]="compact()"
    [class.mb-2]="!compact()"
  >
    {{ label() }}
    @if (required()) {
      <span class="text-burgundy" aria-hidden="true">*</span>
    }
  </span>

  <div
    class="relative flex items-center rounded-lg border border-solid bg-white transition-colors"
    [class.h-11]="compact()"
    [class.h-12]="!compact()"
    [class.border-stone-500]="!showError()"
    [class.border-red-400]="showError()"
    [class.bg-stone-50]="disabled()"
    [class.opacity-60]="disabled()"
    [class.focus-within:border-burgundy]="!showError()"
    [class.focus-within:ring-1]="!showError()"
    [class.focus-within:ring-burgundy/20]="!showError()"
  >
    <span class="pointer-events-none shrink-0 pl-4 text-stone-400">
      <svg lucideLock [size]="16" aria-hidden="true"></svg>
    </span>
    <input
      class="h-full min-w-0 w-full bg-transparent px-2 py-0 text-sm leading-5 text-charcoal outline-none placeholder:text-sm placeholder:leading-5 placeholder:text-stone-400 disabled:cursor-not-allowed"
      [id]="inputId()"
      [name]="'gb-pass-' + inputId()"
      [type]="visible() ? 'text' : 'password'"
      [placeholder]="placeholder()"
      [required]="required()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.autocorrect]="'off'"
      [attr.autocapitalize]="'none'"
      [attr.spellcheck]="false"
      [attr.data-lpignore]="'true'"
      [attr.data-1p-ignore]="'true'"
      [attr.data-form-type]="'other'"
      [attr.readonly]="suggestionsLocked() ? '' : null"
      [attr.aria-invalid]="showError()"
      [attr.aria-describedby]="showError() ? inputId() + '-error' : null"
      [value]="value()"
      (input)="onInput($event)"
      (focus)="unlockSuggestions($event)"
      (blur)="markTouched()"
    />
    <button
      type="button"
      class="mr-3 inline-flex items-center justify-center text-stone-500 focus-visible:outline-none"
      [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible()"
      [disabled]="disabled()"
      (click)="toggleVisibility()"
    >
      <svg [lucideIcon]="visibilityIcon()" [size]="18" aria-hidden="true"></svg>
    </button>
  </div>

  @if (showError() && resolvedError()) {
    <p [id]="inputId() + '-error'" class="mt-1 text-xs text-red-600" role="alert">
      {{ resolvedError() }}
    </p>
  }
</label>
