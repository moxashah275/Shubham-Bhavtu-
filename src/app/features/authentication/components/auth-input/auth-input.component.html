<label class="block min-w-0">
  <span
    class="block text-sm font-medium leading-5 text-charcoal/80"
    [class.sr-only]="!showLabel()"
    [class.mb-1]="showLabel() && compact()"
    [class.mb-1.5]="showLabel() && !compact()"
  >
    {{ label() }}
    @if (required() && showLabel()) {
      <span class="text-burgundy" aria-hidden="true">*</span>
    }
  </span>

  <div
    class="relative flex items-center rounded-lg border border-solid bg-white transition-colors"
    [class.h-11]="compact()"
    [class.h-12]="!compact()"
    [class.border-stone-500]="!showError()"
    [class.border-red-400]="showError()"
    [class.bg-stone-50]="disabled()"
    [class.opacity-60]="disabled()"
    [class.focus-within:border-burgundy]="!showError()"
    [class.focus-within:ring-1]="!showError()"
    [class.focus-within:ring-burgundy/20]="!showError()"
  >
    @if (icon(); as fieldIcon) {
      <span class="pointer-events-none shrink-0 pl-4 text-stone-400">
        <svg [lucideIcon]="fieldIcon" [size]="16" aria-hidden="true"></svg>
      </span>
    }

    @if (type() === 'select') {
      <button
        type="button"
        class="flex h-full min-w-0 w-full items-center justify-between gap-2 bg-transparent py-0 pl-4 pr-3 text-left text-sm leading-5 outline-none disabled:cursor-not-allowed"
        [class.pl-2]="icon()"
        [id]="inputId()"
        [disabled]="disabled()"
        [attr.aria-haspopup]="'listbox'"
        [attr.aria-expanded]="open()"
        [attr.aria-invalid]="showError()"
        [attr.aria-describedby]="showError() ? inputId() + '-error' : null"
        (click)="toggleSelect($event)"
      >
        <span
          class="min-w-0 flex-1 whitespace-nowrap text-sm leading-5"
          [class.text-charcoal]="selectedLabel()"
          [class.text-stone-400]="!selectedLabel()"
        >
          {{ selectedLabel() || placeholder() || 'Select' }}
        </span>
        <svg
          lucideChevronDown
          [size]="16"
          class="shrink-0 text-stone-500 transition-transform"
          [class.rotate-180]="open()"
          aria-hidden="true"
        ></svg>
      </button>

      @if (open()) {
        <ul
          [id]="inputId() + '-list'"
          role="listbox"
          class="absolute top-[calc(100%+4px)] left-0 z-[70] max-h-48 w-full overflow-y-auto rounded-lg border border-solid border-stone-500 bg-white py-1 shadow-lg"
          (click)="keepOpen($event)"
        >
          @for (option of options(); track option.value) {
            <li>
              <button
                type="button"
                role="option"
                class="flex w-full px-4 py-2 text-left text-sm leading-5 text-charcoal hover:bg-blush"
                [class.bg-blush]="option.value === value()"
                [class.font-medium]="option.value === value()"
                [attr.aria-selected]="option.value === value()"
                (click)="chooseOption($event, option)"
              >
                {{ option.label }}
              </button>
            </li>
          }
        </ul>
      }
    } @else {
      <input
        class="h-full w-full min-w-0 bg-transparent py-0 pr-4 text-sm leading-5 text-charcoal outline-none placeholder:text-sm placeholder:leading-5 placeholder:text-stone-400 disabled:cursor-not-allowed"
        [class.pl-4]="!icon()"
        [class.pl-2]="icon()"
        [id]="inputId()"
        [type]="type()"
        [placeholder]="placeholder()"
        [required]="required()"
        [disabled]="disabled()"
        [attr.autocomplete]="autocomplete()"
        [attr.inputmode]="inputMode()"
        [attr.maxlength]="maxLength()"
        [attr.aria-invalid]="showError()"
        [attr.aria-describedby]="showError() ? inputId() + '-error' : null"
        [value]="value()"
        (input)="onInput($event)"
        (blur)="markTouched()"
      />
    }
  </div>

  @if (showError() && resolvedError()) {
    <p [id]="inputId() + '-error'" class="mt-1 text-xs leading-5 text-red-600" role="alert">
      {{ resolvedError() }}
    </p>
  }
</label>
