<div class="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-6">
  <button
    type="button"
    class="absolute inset-0 bg-charcoal/40 backdrop-blur-md"
    aria-label="Close profile"
    (click)="closed.emit()"
  ></button>

  <div
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'member-title-' + member().id"
    class="relative h-[min(44rem,calc(100vh-1.5rem))] w-full max-w-[min(54rem,calc(100vw-1.5rem))] overflow-hidden rounded-2xl border border-gold/15 shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="absolute top-3 right-3 z-10 inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-white text-charcoal shadow-sm transition hover:bg-blush"
      aria-label="Close"
      (click)="closed.emit()"
    >
      <svg [lucideIcon]="LucideX" [size]="18" aria-hidden="true"></svg>
    </button>

    <app-member-profile-card
      [member]="member()"
      [shortlisted]="shortlisted()"
      [interested]="interested()"
      [scrollable]="true"
      (toggleShortlist)="toggleShortlist.emit($event)"
      (expressInterest)="expressInterest.emit($event)"
      (withdrawInterest)="withdrawInterest.emit($event)"
      (message)="message.emit($event)"
    />
  </div>
</div>
