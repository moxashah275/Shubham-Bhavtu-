<div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6">
  <button
    type="button"
    class="absolute inset-0 bg-charcoal/35 backdrop-blur-md"
    aria-label="Close match details"
    (click)="closed.emit()"
  ></button>

  <div
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'match-title-' + story().id"
    class="relative grid w-full max-w-[min(36rem,calc(100vw-1.5rem))] overflow-hidden rounded-2xl border border-gold/15 bg-ivory shadow-2xl sm:max-w-[min(36rem,calc(100vw-3rem))] sm:grid-cols-2"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="absolute top-2 right-2 z-10 inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-white text-charcoal shadow-sm sm:top-3 sm:right-3"
      aria-label="Close"
      (click)="closed.emit()"
    >
      <svg [lucideIcon]="LucideX" [size]="18" aria-hidden="true"></svg>
    </button>

    <img
      [src]="story().imageSrc"
      [alt]="story().names"
      class="h-44 w-full object-cover object-[center_18%] sm:h-full sm:min-h-[22rem]"
    />

    <div class="p-4 sm:p-5">
      <h2 [id]="'match-title-' + story().id" class="pr-10 font-serif text-xl leading-snug text-charcoal sm:text-2xl">
        {{ story().names }}
      </h2>
      <p class="mt-1 text-sm font-medium text-burgundy">{{ story().city }}</p>

      <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2">
        @if (story().religion) {
          <div>
            <p class="text-[11px] font-semibold tracking-[0.16em] text-gold-deep uppercase">Religion</p>
            <p class="mt-1 text-sm text-charcoal">{{ story().religion }}</p>
          </div>
        }
        @if (story().community) {
          <div>
            <p class="text-[11px] font-semibold tracking-[0.16em] text-gold-deep uppercase">Community</p>
            <p class="mt-1 text-sm text-charcoal">{{ story().community }}</p>
          </div>
        }
        @if (story().matchedOn) {
          <div>
            <p class="text-[11px] font-semibold tracking-[0.16em] text-gold-deep uppercase">Matched</p>
            <p class="mt-1 text-sm text-charcoal">{{ story().matchedOn }}</p>
          </div>
        }
      </div>

      <p class="mt-3 text-sm leading-6 text-stone-500">
        {{ story().details || story().story }}
      </p>
    </div>
  </div>
</div>
