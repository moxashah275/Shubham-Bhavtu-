<article class="flex h-full min-w-0 flex-col overflow-hidden rounded-2xl border border-gold/15 bg-white shadow-sm">
  <div class="relative h-52 overflow-hidden sm:h-60">
    <img [src]="story().imageSrc" [alt]="story().names" class="h-full w-full object-cover object-[center_12%]" />
    <span class="absolute top-3 left-3 rounded-full bg-burgundy/90 px-2.5 py-1 text-[11px] font-medium tracking-wide text-white">
      Matched
    </span>
  </div>
  <div class="flex flex-1 flex-col px-4 pt-2.5 pb-3 sm:px-5 sm:pt-3 sm:pb-3">
    <h3 class="font-serif text-lg leading-snug text-charcoal sm:text-xl">{{ story().names }}</h3>
    <p class="mt-1 text-sm font-medium text-burgundy">{{ story().city }}</p>
    <p class="mt-2 line-clamp-3 text-sm leading-6 text-stone-500">{{ story().story }}</p>
    <button
      type="button"
      class="group/more mt-auto inline-flex w-fit cursor-pointer items-center gap-1.5 self-start pt-3 text-base font-semibold text-burgundy"
      (click)="viewMore.emit(story())"
    >
      <span class="group-hover/more:underline">View more</span>
      <svg [lucideIcon]="ArrowUpRight" [size]="18" aria-hidden="true"></svg>
    </button>
  </div>
</article>
