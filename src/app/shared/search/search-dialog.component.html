@if (open()) {
  <div class="fixed inset-0 z-[60] flex items-center justify-center p-4" (click)="close()">
    <div class="absolute inset-0 bg-charcoal/40 backdrop-blur-md"></div>

    <article
      role="dialog"
      aria-modal="true"
      aria-labelledby="search-dialog-title"
      class="relative w-full max-w-xl rounded-2xl border border-gold/20 bg-white p-5 shadow-2xl sm:p-7"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="absolute top-3 right-3 inline-flex h-10 w-10 items-center justify-center rounded-full text-charcoal transition hover:bg-blush"
        aria-label="Close search"
        (click)="close()"
      >
        <svg lucideX [size]="18" aria-hidden="true"></svg>
      </button>

      <p class="text-xs font-semibold tracking-[0.18em] text-gold uppercase">Find a match</p>
      <div class="w-fit">
        <h2 id="search-dialog-title" class="mt-2 font-serif text-2xl text-charcoal sm:text-3xl">Who are you looking for?</h2>
        <span class="mt-1.5 block h-px w-1/2 bg-gold"></span>
      </div>
      <p class="mt-3 text-sm text-stone-500">Choose Looking For, age, religion, and status — then see matching profiles.</p>

      <form class="mt-6 grid gap-4 sm:grid-cols-2" (submit)="$event.preventDefault(); search()">
        <label class="block text-xs font-medium text-stone-500">
          Looking For
          <app-search-select
            name="dialogLookingFor"
            placeholder="Select"
            [options]="lookingForOptions"
            [(value)]="lookingFor"
          />
          @if (fieldError().lookingFor) {
            <span class="mt-1.5 block text-[11px] font-medium text-burgundy">Please choose who you are looking for.</span>
          }
        </label>
        <label class="block text-xs font-medium text-stone-500">
          Age
          <app-search-select name="dialogAge" placeholder="Select" [options]="ageOptions" [(value)]="age" />
          @if (fieldError().age) {
            <span class="mt-1.5 block text-[11px] font-medium text-burgundy">Please choose an age.</span>
          }
        </label>
        <label class="block text-xs font-medium text-stone-500">
          Religion
          <app-search-select
            name="dialogReligion"
            placeholder="Select"
            [options]="religionOptions"
            [(value)]="religion"
          />
          @if (fieldError().religion) {
            <span class="mt-1.5 block text-[11px] font-medium text-burgundy">Please choose a religion.</span>
          }
        </label>
        <label class="block text-xs font-medium text-stone-500">
          Married Status
          <app-search-select
            name="dialogMarital"
            placeholder="Select"
            [options]="maritalOptions"
            [(value)]="maritalStatus"
          />
          @if (fieldError().maritalStatus) {
            <span class="mt-1.5 block text-[11px] font-medium text-burgundy">Please choose married status.</span>
          }
        </label>

        <button
          type="submit"
          class="inline-flex h-12 items-center justify-center gap-2 rounded-lg bg-burgundy text-sm font-semibold text-white transition hover:bg-burgundy-deep sm:col-span-2"
        >
          <svg lucideSearch [size]="18" aria-hidden="true"></svg>
          Search
        </button>
        <p class="sm:col-span-2 text-center text-[11px] leading-5 text-stone-400">
          You can refine height, city, diet, and more after results open.
        </p>
      </form>
    </article>
  </div>
}
