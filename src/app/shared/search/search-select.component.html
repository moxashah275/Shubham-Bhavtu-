<button
  type="button"
  class="flex h-11 w-full items-center justify-between rounded-lg border border-stone-400 px-3 text-left text-sm outline-none focus:border-burgundy"
  [class.bg-white]="!disabled()"
  [class.bg-stone-100]="disabled()"
  [class.cursor-not-allowed]="disabled()"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="name() + '-list'"
  (click)="toggle($event)"
>
  <span [class]="selectedLabel() ? 'text-charcoal' : 'text-stone-400'">
    {{ selectedLabel() || placeholder() }}
  </span>
  <svg
    lucideChevronDown
    [size]="16"
    class="shrink-0 text-stone-400 transition-transform duration-200"
    [class.rotate-180]="open()"
    aria-hidden="true"
  ></svg>
</button>

@if (open()) {
  <ul
    [id]="name() + '-list'"
    role="listbox"
    class="absolute left-0 z-50 max-h-56 w-full overflow-y-auto rounded-lg border border-stone-400 bg-white py-1 text-sm text-charcoal shadow-lg"
    [class.mt-1]="!openUp()"
    [class.bottom-full]="openUp()"
    [class.mb-1]="openUp()"
    (click)="keepOpen($event)"
  >
    @for (option of options(); track option.value) {
      <li>
        <button
          type="button"
          role="option"
          class="flex w-full px-3 py-2 text-left hover:bg-blush"
          [attr.aria-selected]="option.value === value()"
          (click)="choose($event, option)"
        >
          {{ option.label }}
        </button>
      </li>
    }
  </ul>
}
