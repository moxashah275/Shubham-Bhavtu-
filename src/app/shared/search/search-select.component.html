<button
  type="button"
  class="profile-select-trigger"
  [class.bg-stone-100]="disabled()"
  [class.cursor-not-allowed]="disabled()"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="name() + '-list'"
  (click)="toggle($event)"
>
  <span [class]="selectedLabel() ? 'text-charcoal' : 'text-stone-400'">
    {{ selectedLabel() || placeholder() }}
  </span>
  <svg
    lucideChevronDown
    [size]="16"
    class="shrink-0 text-stone-400 transition-transform duration-200"
    [class.rotate-180]="open()"
    aria-hidden="true"
  ></svg>
</button>

@if (open()) {
  <ul
    [id]="name() + '-list'"
    role="listbox"
    class="profile-select-menu"
    [class.profile-select-menu--below]="!openUp()"
    [class.profile-select-menu--above]="openUp()"
    (click)="keepOpen($event)"
  >
    @for (option of options(); track option.value) {
      <li>
        <button
          type="button"
          role="option"
          class="profile-select-menu__option"
          [class.profile-select-menu__option--selected]="option.value === value()"
          [attr.aria-selected]="option.value === value()"
          (click)="choose($event, option)"
        >
          {{ option.label }}
        </button>
      </li>
    }
  </ul>
}
