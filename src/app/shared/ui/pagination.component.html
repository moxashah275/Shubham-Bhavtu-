@if (totalPages() > 1) {
  <nav class="flex items-center justify-center gap-2" [attr.aria-label]="label()">
    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-gold/30 bg-white text-stone-500 transition enabled:hover:border-burgundy enabled:hover:text-burgundy disabled:opacity-40"
      [disabled]="page() === 1"
      aria-label="Previous page"
      (click)="go(page() - 1)"
    >
      <svg lucideChevronLeft [size]="16" aria-hidden="true"></svg>
    </button>

    @for (item of pages(); track item) {
      <button
        type="button"
        class="h-9 min-w-9 rounded-full px-3 text-sm font-semibold transition"
        [class.bg-burgundy]="page() === item"
        [class.text-white]="page() === item"
        [class.border]="page() !== item"
        [class.border-gold]="page() !== item"
        [class.bg-white]="page() !== item"
        [class.text-charcoal]="page() !== item"
        [attr.aria-current]="page() === item ? 'page' : null"
        (click)="go(item)"
      >
        {{ item }}
      </button>
    }

    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-gold/30 bg-white text-stone-500 transition enabled:hover:border-burgundy enabled:hover:text-burgundy disabled:opacity-40"
      [disabled]="page() === totalPages()"
      aria-label="Next page"
      (click)="go(page() + 1)"
    >
      <svg lucideChevronRight [size]="16" aria-hidden="true"></svg>
    </button>
  </nav>
}
