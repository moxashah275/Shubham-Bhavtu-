<article
  class="relative isolate flex h-full flex-col overflow-hidden rounded-2xl border border-gold/15 bg-white shadow-[0_12px_32px_rgba(43,36,32,0.08)] transition duration-300 hover:border-gold/35 hover:shadow-[0_18px_44px_rgba(43,36,32,0.12)]"
>
  <div class="relative">
    <img [src]="event().imageSrc" [alt]="event().title" class="h-40 w-full object-cover" />
    <div class="absolute inset-0 bg-gradient-to-t from-charcoal/55 to-transparent"></div>

    <span
      class="absolute top-3 left-3 rounded-full px-3 py-1 text-[11px] font-semibold tracking-[0.1em] uppercase shadow"
      [class]="free() ? 'bg-gold text-charcoal' : 'bg-burgundy text-ivory'"
    >
      {{ feeBadge() }}
    </span>

    <span class="absolute top-3 right-3 rounded-full bg-white/95 px-3 py-1 text-[11px] font-semibold text-burgundy shadow">
      {{ shortDate() }}
    </span>

    <p class="absolute bottom-2 left-3 text-[11px] font-semibold tracking-[0.16em] text-ivory uppercase">
      {{ event().category }}
    </p>
  </div>

  <div class="flex flex-1 flex-col p-5">
    <h3 class="line-clamp-2 min-h-[3.25rem] font-serif text-xl leading-snug text-charcoal">{{ event().title }}</h3>

    <div class="mt-3 space-y-1.5 text-sm text-stone-500">
      <p class="flex items-center gap-2">
        <svg lucideCalendar [size]="15" class="shrink-0 text-gold-deep" aria-hidden="true"></svg>
        <span class="line-clamp-1">{{ dateLabel() }}</span>
      </p>
      <p class="flex items-center gap-2">
        <svg lucideMapPin [size]="15" class="shrink-0 text-gold-deep" aria-hidden="true"></svg>
        <span class="line-clamp-1">{{ event().venue }}, {{ event().city }}</span>
      </p>
      <p class="flex items-center gap-2">
        <svg lucideClock [size]="15" class="shrink-0 text-gold-deep" aria-hidden="true"></svg>
        <span class="line-clamp-1">{{ event().time }}</span>
      </p>
      <p class="flex items-center gap-2">
        <svg lucideUser [size]="15" class="shrink-0 text-gold-deep" aria-hidden="true"></svg>
        <span class="line-clamp-1">{{ event().host }}</span>
      </p>
    </div>

    <div class="mt-auto pt-4">
      <div class="flex items-center justify-between text-xs">
        <span [class]="almostFull() ? 'font-semibold text-burgundy' : 'text-stone-500'">
          {{ event().seatsLeft }} of {{ event().totalSeats }} seats left
        </span>
        <span class="font-medium text-stone-500">{{ availability() }}</span>
      </div>
      <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-blush">
        <div class="h-full rounded-full bg-gold" [style.width.%]="filledPercent()"></div>
      </div>

      <button
        type="button"
        class="mt-4 inline-flex h-11 w-full items-center justify-center gap-1.5 rounded-lg bg-burgundy text-sm font-semibold text-ivory transition hover:bg-burgundy-deep"
        (click)="opened.emit(event().id)"
      >
        View Details
        <svg lucideArrowRight [size]="16" aria-hidden="true"></svg>
      </button>
    </div>
  </div>
</article>
