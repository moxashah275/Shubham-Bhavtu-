<img
  [src]="imageSrc()"
  [alt]="imageAlt()"
  class="h-56 w-full rounded-2xl object-cover object-[center_20%] sm:h-[320px] lg:h-[360px]"
/>
<p class="mt-8 text-xs font-semibold tracking-[0.18em] text-gold uppercase">Reach us</p>
<div class="w-fit">
  <h2 class="mt-3 font-serif text-2xl text-charcoal sm:text-3xl">{{ title() }}</h2>
  <span class="mt-1.5 block h-px w-1/2 bg-gold"></span>
</div>
<p class="mt-5 text-sm leading-7 text-stone-500">{{ copy() }}</p>
<ul class="mt-8 space-y-5">
  @for (item of details(); track item.label) {
    <li>
      <p class="text-[11px] font-semibold tracking-[0.16em] text-gold-deep uppercase">{{ item.label }}</p>
      <p class="mt-1 text-sm text-charcoal">{{ item.value }}</p>
    </li>
  }
</ul>
